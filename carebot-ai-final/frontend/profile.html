<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareBot AI — Profile Settings</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/features.css" />
</head>
<body>
  <div class="app-shell">
    <div class="sidebar" id="sidebar-root"></div>
    <div class="main">
      <div class="topbar" id="topbar-root"></div>
      <div class="page-content">
        <div class="panel" style="padding:34px;max-width:640px;">
          <div class="icon-badge purple" style="width:56px;height:56px;font-size:24px;">⚙</div>
          <div class="headline" style="font-weight:800;font-size:20px;margin:16px 0 8px;">Profile Settings</div>
          <p style="font-size:13.5px;color:var(--text-muted);line-height:1.7;margin-bottom:18px;">Your own health context is used to personalize requested AI answers.</p>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <span class="pill pill-indigo">AI guidance</span><span class="pill pill-indigo">Navigation aid</span>
          </div>
          <form id="profileForm" class="feature-form"><label class="field-label">Age<input class="field-input" id="age" type="number" min="1" max="120"></label><label class="field-label">Gender (optional)<input class="field-input" id="gender" type="text" maxlength="30"></label><div class="feature-row"><label class="field-label">Weight (kg)<input class="field-input" id="weight_kg" type="number" min="1" max="500" step="0.1"></label><label class="field-label">Height (cm)<input class="field-input" id="height_cm" type="number" min="30" max="250" step="0.1"></label></div><label class="field-label">Known conditions<input class="field-input" id="known_conditions" type="text" maxlength="3000"></label><label class="field-label">Food preferences<input class="field-input" id="preferences" type="text" maxlength="1500"></label><label class="field-label">Allergies<input class="field-input" id="allergies" type="text" maxlength="1500"></label><label class="field-label">Timezone (IANA name)<input class="field-input" id="timezone" type="text" required placeholder="Asia/Kolkata"></label><button class="btn-gradient" type="submit">Save profile</button></form><p id="bmiResult" class="disclaimer"></p>
        </div>
      </div>
    </div>
  </div>

  <script src="js/constants.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
