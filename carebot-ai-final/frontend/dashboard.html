<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareBot AI — Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/features.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
  <div class="app-shell">
    <div class="sidebar" id="sidebar-root"></div>
    <div class="main">
      <div class="topbar" id="topbar-root"></div>
      <div class="page-content">

        <div class="stat-grid">
          <div class="panel hover-lift stat-card">
            <div class="stat-top"><div class="section-label">Blood Pressure</div>
              <div class="icon-badge red" style="width:34px;height:34px;font-size:14px;">❤</div></div>
            <div class="stat-value">—</div>
            <span class="trend-arrow trend-up">No readings yet</span>
          </div>
          <div class="panel hover-lift stat-card">
            <div class="stat-top"><div class="section-label">Heart Rate</div>
              <div class="icon-badge orange" style="width:34px;height:34px;font-size:14px;">⚡</div></div>
            <div class="stat-value">—</div>
            <span class="trend-arrow trend-up">No readings yet</span>
          </div>
          <div class="panel hover-lift stat-card">
            <div class="stat-top"><div class="section-label">Water Intake</div>
              <div class="icon-badge blue" style="width:34px;height:34px;font-size:14px;">💧</div></div>
            <div class="stat-value">—</div>
            <span class="trend-arrow trend-up">No readings yet</span>
          </div>
          <div class="panel hover-lift stat-card">
            <div class="stat-top"><div class="section-label">Adherence</div>
              <div class="icon-badge green" style="width:34px;height:34px;font-size:14px;">💊</div></div>
            <div class="stat-value">—</div>
            <span class="trend-arrow trend-up">No readings yet</span>
          </div>
        </div>

        <div class="dash-row">
          <div class="panel chart-panel">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <div class="section-label">7-day vitals trend</div>
              <span class="pill pill-indigo">This week</span>
            </div>
            <canvas id="vitalsChart" height="90"></canvas>
          </div>

          <div class="panel reminders-panel">
            <div class="section-label">Today's reminders</div>
            <div id="remindersList"></div>
          </div>
        </div>

        <div style="margin-top:28px;">
          <div class="section-label">Modules</div>
          <div class="module-grid" id="moduleGrid"></div>
        </div>

      </div>
    </div>
  </div>

  <script src="js/constants.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
