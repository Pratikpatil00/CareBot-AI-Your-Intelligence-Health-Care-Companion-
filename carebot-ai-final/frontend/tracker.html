<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareBot AI — Health Tracker</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/features.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
  <div class="app-shell">
    <div class="sidebar" id="sidebar-root"></div>
    <div class="main">
      <div class="topbar" id="topbar-root"></div>
      <div class="page-content">

        <div class="dash-row">
          <div class="panel chart-panel">
            <div class="section-label">Vitals trend</div>
            <canvas id="trackerChart" height="100"></canvas>
            <div style="margin-top:18px;">
              <div class="section-label">Recent entries</div>
              <table class="data-table">
                <thead><tr><th>Day</th><th>Systolic BP</th><th>Heart rate</th></tr></thead>
                <tbody id="entriesBody"></tbody>
              </table>
            </div>
          </div>

          <div class="panel reminders-panel" style="align-self:flex-start;">
            <div class="section-label">Log a new reading</div>
            <label class="field-label">Systolic BP (mmHg)</label>
            <input class="field-input" id="bpInput" type="text" placeholder="e.g. 120" />
            <label class="field-label" style="margin-top:14px;">Heart rate (bpm)</label>
            <input class="field-input" id="hrInput" type="text" placeholder="e.g. 74" />
            <button class="btn-gradient" id="saveBtn" style="margin-top:18px;width:100%;">Save reading</button>
            <p style="font-size:12px;color:var(--text-muted);margin-top:14px;line-height:1.5;">
              Readings are recorded from user or device input and organized into trends — a single value is never treated as a diagnosis.
            </p>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="js/constants.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/tracker.js"></script>
</body>
</html>
