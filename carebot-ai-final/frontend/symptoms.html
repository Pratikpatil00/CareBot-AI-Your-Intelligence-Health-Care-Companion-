<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareBot AI — Symptom Checker</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/features.css" />
</head>
<body>
  <div class="app-shell">
    <div class="sidebar" id="sidebar-root"></div>
    <div class="main">
      <div class="topbar" id="topbar-root"></div>
      <div class="page-content">
        <div class="panel" style="padding:34px;max-width:640px;">
          <div class="icon-badge purple" style="width:56px;height:56px;font-size:24px;">✧</div>
          <div class="headline" style="font-weight:800;font-size:20px;margin:16px 0 8px;">Symptom Checker</div>
          <p style="font-size:13.5px;color:var(--text-muted);line-height:1.7;margin-bottom:18px;">Describe what you are experiencing for educational guidance and next steps.</p>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <span class="pill pill-indigo">AI guidance</span><span class="pill pill-indigo">Navigation aid</span>
          </div>
          <form id="symptomForm" class="feature-form"><label class="field-label">Symptoms, duration and severity<textarea class="field-input" id="symptomsText" required maxlength="6000"></textarea></label><button class="btn-gradient" type="submit">Analyze symptoms</button></form><p class="disclaimer">Possible causes are not a diagnosis. Without a trained local model, CareBot offers educational guidance only. Local model scores, when enabled, are not clinical probabilities.</p><div id="symptomResult" class="feature-result"></div><div id="analysisHistory"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/constants.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/symptoms.js"></script>
</body>
</html>
