<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareBot AI — X-Ray Analyzer</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/features.css" />
</head>
<body>
  <div class="app-shell">
    <div class="sidebar" id="sidebar-root"></div>
    <div class="main">
      <div class="topbar" id="topbar-root"></div>
      <div class="page-content">
        <div class="panel" style="padding:34px;max-width:640px;">
          <div class="icon-badge green" style="width:56px;height:56px;font-size:24px;">🩻</div>
          <div class="headline" style="font-weight:800;font-size:20px;margin:16px 0 8px;">X-Ray Analyzer</div>
          <p style="font-size:13.5px;color:var(--text-muted);line-height:1.7;margin-bottom:18px;">Upload an X-ray for educational observations and a plain-language explanation. Keep the results with your health records for review with a clinician.</p>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <span class="pill pill-indigo">Vision AI</span><span class="pill pill-indigo">Region-dependent</span><span class="pill pill-indigo">Non-diagnostic</span>
          </div>
          <form id="xrayForm" class="feature-form"><label class="field-label">Body region<select class="field-input" id="xrayRegion"><option value="chest">Chest</option><option value="bone">Bone</option></select></label><input id="xrayFile" type="file" accept=".png,.jpg,.jpeg,.webp" required><button class="btn-gradient" type="submit">Analyze image</button></form><p class="disclaimer">Educational AI observations only.</p><div id="xrayResult" class="feature-result"></div><div class="section-label" style="margin-top:20px;">Image history</div><div id="xrayHistory"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/constants.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/xray.js"></script>
</body>
</html>
